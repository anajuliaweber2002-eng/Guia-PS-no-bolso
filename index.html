.upd{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 .9rem var(--f-ui);padding:10px 18px;box-shadow:0 4px 14px rgb(0 0 0/.25);cursor:pointer}</style>
</head>
<body>
<style>
/* Layout: menu lateral de seções (gaveta no celular, fixo no PC) + abas internas em chips; paleta vermelha (pronto socorro) com destaque azul-petróleo */
:root{
  --bg:#faf5f5; --surface:#ffffff; --sunk:#f5e9ea; --line:#ead7d9;
  --fg:#2a1a1d; --muted:#6c5a5e; --accent:#b4233c; --accent-fg:#ffffff; --accent-soft:#fbe4e7; --accent2:#0b7285; --accent2-soft:#dcf1f4;
  --ok:#1f7a3a; --ok-soft:#dff1e4; --warn:#93600a; --warn-soft:#f8ecd3; --bad:#a3262a; --bad-soft:#f7dede;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1214; --surface:#22181b; --sunk:#2e2125; --line:#463338;
  --fg:#f6eced; --muted:#bfa9ad; --accent:#ff8597; --accent-fg:#2a0d13; --accent-soft:#4a2028; --accent2:#66d9e8; --accent2-soft:#163a40;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1214; --surface:#22181b; --sunk:#2e2125; --line:#463338;
  --fg:#f6eced; --muted:#bfa9ad; --accent:#ff8597; --accent-fg:#2a0d13; --accent-soft:#4a2028; --accent2:#66d9e8; --accent2-soft:#163a40;
  --ok:#6fcf8a; --ok-soft:#163423; --warn:#e6b45a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1a1b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 0;display:grid;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.rx{margin:0;white-space:pre-wrap;font:13px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.rxcard h3{margin:0;font-size:.95rem}
.rec{font-size:.82rem;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 12px}
h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.search{position:relative}
.search input{padding:8px 12px;border-radius:999px;font-size:.92rem;background:var(--bg)}
#qres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0/.18);max-height:60vh;overflow-y:auto;z-index:8;display:grid}
.qr{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;padding:9px 12px;cursor:pointer}
.qr:hover,.qr:focus-visible{background:var(--accent-soft)}
.qr.none{display:block;color:var(--muted);font-size:.88rem;cursor:default}
.qs{font:700 .66rem var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.ql{font-weight:600;font-size:.92rem}
.qd{grid-column:2;font-size:.78rem;color:var(--muted)}
.favs{padding-bottom:0;align-items:center}
.favlbl{color:var(--accent2);font-size:1rem;flex:none}
.chip.fav{border-color:var(--accent2)}
.chip.fav[aria-selected="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff}
.ctag{font:700 .62rem var(--f-ui);text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-right:5px}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--accent2);font:600 .78rem var(--f-ui);padding:4px 10px;border-radius:999px;cursor:pointer}
.star[aria-pressed="true"]{background:var(--accent2-soft);border-color:var(--accent2)}
.star span{color:var(--fg)}
.menu-btn{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-content:center;gap:4px;cursor:pointer}
.menu-btn span{display:block;width:18px;height:2px;background:var(--fg);border-radius:2px}
.ttl{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.sec-name{font-weight:600;font-size:.92rem;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{justify-content:flex-start}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:30;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .22s ease;box-shadow:4px 0 24px rgb(0 0 0/.18)}
.menu-h{font-weight:700;font-size:1.05rem;padding:6px 10px 4px}
.menu-bg{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
body.menu-open .menu{transform:none}
body.menu-open .menu-bg{opacity:1;pointer-events:auto}
.mg{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:500 .93rem var(--f-ui);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.mi:hover{background:var(--sunk)}
.mi[aria-current="true"]{background:var(--sunk);color:var(--fg);font-weight:700}
.mic{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.mi[aria-current="true"] .mic{background:var(--accent);color:var(--accent-fg)}
.logo{display:inline-grid;align-self:center}
.sec-name{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sec-name span{overflow:hidden;text-overflow:ellipsis}
.ttl h1{white-space:nowrap}
.sec-name svg{flex:none}
.hic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);margin-right:8px;vertical-align:-7px}
.mrow{display:flex;align-items:center;gap:2px}
.mrow .mi{flex:1;min-width:0}
.mx{flex:none;width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.mx:hover{background:var(--sunk)}
.mx svg{transition:transform .15s}
.mx[aria-expanded="true"] svg{transform:rotate(180deg)}
.msub{display:grid;gap:1px;padding:2px 0 8px 52px}
.msi{border:0;background:none;color:var(--fg);font:400 .86rem var(--f-ui);text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;line-height:1.3}
.msi:hover{background:var(--sunk)}
.msi[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.msi .ctag{display:inline-block;min-width:34px}
select.chip.pick{appearance:none;-webkit-appearance:none;background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600;padding-right:12px;max-width:9.5em}
.mn{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:1000px){
  .menu{transform:none;box-shadow:none;width:260px;top:0}
  .menu-bg,.menu-btn{display:none}
  header,main{margin-left:260px}
  .menu-h{display:none}
}
@media print{.menu,.menu-bg{display:none!important}header,main{margin-left:0!important}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .85rem var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:16px 48px;display:grid;gap:16px}
.panel{display:grid;gap:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{margin:0;font-size:1.05rem;text-wrap:balance}
.code{font:600 .72rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.note{color:var(--muted);font-size:.82rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}

textarea.soap{width:100%;min-height:60vh;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:13.5px/1.55 var(--f-mono);padding:12px}.rxadj{grid-column:2;display:grid;gap:4px;font-size:.84rem;line-height:1.4}.rxint .chip.tag,.rxadj .chip.tag{white-space:nowrap}#bnav{display:none}
@media (max-width:999px){body.has-bnav #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}#bnav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:1px;padding:7px 2px 6px;font:600 .68rem var(--f-ui);cursor:pointer}#bnav small{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}#bnav button[aria-current="page"]{color:var(--accent)}body.has-bnav main{padding-bottom:70px}body.has-bnav .sticky-bar{bottom:58px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}.seg button{border:0;background:none;padding:6px 14px;font:600 .85rem var(--f-ui);color:var(--fg);cursor:pointer}.seg [aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.inig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media (min-width:700px){.inig{grid-template-columns:repeat(3,minmax(0,1fr))}}
.init{display:grid;gap:4px;justify-items:start;align-content:start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);cursor:pointer;min-height:122px;font:inherit}.init b{font-size:1rem;line-height:1.25}.init small{color:var(--muted);font-size:.8rem;line-height:1.3}.inii{color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:8px;display:inline-grid;margin-bottom:4px}.inil{display:grid;gap:6px}
.card.gd>.lbl-row{position:sticky;top:var(--hh,0px);z-index:2;background:var(--surface);margin:-14px -14px 0;padding:12px 14px 8px;border-radius:var(--r) var(--r) 0 0}
.card.gd.acc>.lbl-row>span{cursor:pointer}.card.gd.acc>.lbl-row>span::before{content:'▾ ';color:var(--muted)}.card.gd.acc-x>.lbl-row>span::before{content:'▸ '}.card.gd.acc-x>:not(.lbl-row){display:none}.card.gd.acc-x>.lbl-row{position:static}
.soapnav{position:sticky;top:var(--hh,0px);z-index:3;display:flex;gap:6px;background:var(--bg);padding:6px 0}.soapnav button{flex:1;max-width:64px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:700 .9rem var(--f-ui);padding:6px 0;color:var(--fg);cursor:pointer}.soapnav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.soapnav button:disabled{opacity:.35}
@media print{#bnav,.soapnav,.accbar{display:none!important}.card.gd.acc-x>:not(.lbl-row){display:revert}}
.soap.efn{min-height:80px;resize:none;overflow:hidden}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-ui);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:6px 10px;font-size:.8rem}
.sticky-bar{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;font:500 1rem var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.sexo{display:flex;gap:6px}
.sexo label{flex:1}

.result{border-radius:var(--r);padding:14px;display:grid;gap:6px;background:var(--sunk)}
.result .big{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.result .big small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:4px}
.result .sub{font-size:.9rem}
.pill{display:inline-block;font:700 .78rem var(--f-ui);padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.result.ok{background:var(--ok-soft)} .result.warn{background:var(--warn-soft)} .result.bad{background:var(--bad-soft)}
.result.ok,.result.warn,.result.bad{color:var(--fg)}
.rows{display:grid;gap:4px;font-size:.9rem;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:3px}
.rows div span:first-child{color:var(--muted)}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;font-size:.9rem}
.ex{font:600 .7rem var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}

.q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:8px}
.q legend{padding:0;font-size:.92rem;font-weight:500;float:left;width:100%}
.q legend b{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;clear:both}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.8rem;line-height:1.25;background:var(--bg);height:100%}
.opt span i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt input:checked+span i{color:inherit}
.soft .opt input:checked+span{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.soft .opt span{padding-left:34px;position:relative}
.soft .opt span::before{content:'';position:absolute;left:10px;top:9px;width:14px;height:14px;border:2px solid var(--muted);border-radius:4px}
.soft .opt input:checked+span::before{background:var(--accent);border-color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.scale td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.scale td:first-child{white-space:nowrap;font-weight:600;width:1%}
.scale tr.on td{background:var(--accent-soft)}
details{font-size:.86rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:.78rem}
.flow{display:grid;gap:0;counter-reset:st}
.node{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:.9rem}
.node h3{margin:0;font-size:.95rem}
.node.step h3::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.75rem;margin-right:8px;vertical-align:1px}
.node.dec{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.node.dec h3{color:var(--fg)}
.node.goal{background:var(--ok-soft);border-color:var(--ok)}
.node ul{margin:0;padding-left:18px;display:grid;gap:3px}
.arrow{justify-self:center;width:2px;height:22px;background:var(--line);position:relative}
.arrow::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line);border-bottom:0}
.arrow:has(span){height:34px}
.arrow span{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:min(280px,calc(50vw - 36px));font:600 .72rem/1.2 var(--f-ui);color:var(--muted)}
.branch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.branch .node{font-size:.85rem;align-content:start}
.tag{font:700 .68rem var(--f-ui);text-transform:uppercase;letter-spacing:.06em}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.node.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)} .node.bad h3{color:var(--bad)}
.branch .node.br-bad{border-left:4px solid var(--bad)} .branch .node.br-warn{border-left:4px solid var(--warn)} .branch .node.br-ok{border-left:4px solid var(--ok)}
.node .sub{color:var(--muted);font-size:.82rem}
.edtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--accent2-soft);color:var(--accent2);font:700 .66rem var(--f-ui);text-transform:uppercase;letter-spacing:.05em;vertical-align:2px}
.edf{display:grid;gap:10px}
.edf textarea,textarea.nota{width:100%;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f-mono);padding:10px}
textarea.nota{font-family:var(--f-ui);font-size:.9rem}
.btn svg{vertical-align:-2px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lbl-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl-row .btn{text-transform:none;letter-spacing:0}
.edlist{display:grid;gap:6px}
.edrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font:500 .88rem var(--f-ui);cursor:pointer}
.edrow .edtag{margin:0}

   ≥ 75 anos: sem bolus; 0,75 mg/kg SC de 12/12 h (máx. 75 mg nas 2 primeiras)
5. Atorvastatina 80 mg — VO agora
6. ECG 60–90 min após: critérios de reperfusão (queda do supra ≥ 50%, alívio da dor, arritmia de reperfusão)`,n:'Sem reperfusão em 60–90 min: angioplastia de resgate. Com sucesso: cateterismo em 2–24 h. Alternativa: alteplase 15 mg EV em bolus + 0,75 mg/kg em 30 min (máx. 50 mg) + 0,5 mg/kg em 60 min (máx. 35 mg). Contraindicações absolutas: AVCh prévio, AVCi < 3 meses, neoplasia do SNC, sangramento ativo, suspeita de dissecção de aorta, TCE ou cirurgia intracraniana < 2 meses.'}]},

rx_has:{tipo:'h',g:'cv',t:'Crise hipertensiva',rec:RH,rel:[['cd_has','Conduta crise hipertensiva'],['drogas','Drogas vasoativas']],items:[
 {t:'PA elevada sem lesão de órgão-alvo (urgência)',rx:`1. Repouso em local calmo por 30 min e reaferir a PA
2. Tratar dor e ansiedade se presentes
3. Tomar agora a medicação anti-hipertensiva de uso habitual, se não tomou
4. Se mantiver PA ≥ 180x110 mmHg: Captopril 25 mg VO (repetir em 1 h se necessário)
   ou Clonidina 0,100 mg VO (repetir em 1 h, máx. 0,6 mg)
5. Reaferir PA em 1 h. Meta: reduzir gradualmente em 24–48 h, não normalizar no PS`,n:'Não usar nifedipino de ação rápida SL (risco de isquemia). Alta com ajuste do esquema e retorno à UBS em até 7 dias.'},
 {t:'Emergência hipertensiva: nitroprussiato',rx:`1. Nitroprussiato de sódio 50 mg (2 mL) + SG 5% 248 mL (200 mcg/mL) — EV em bomba de infusão, frasco e equipo fotoprotegidos
   Iniciar 0,3 mcg/kg/min (70 kg: ~6 mL/h) e titular a cada 5 min até a meta; máx. 10 mcg/kg/min
2. PAM: reduzir no máximo 20–25% na 1ª hora, depois 160x100 mmHg em 2–6 h
3. PA invasiva ou não invasiva de 5/5 min durante a titulação`,n:'Usar com cautela em IRA/DRC e por mais de 48 h (toxicidade por cianeto/tiocianato). Exceções de meta: dissecção de aorta (PAS < 120 em 20 min), AVC (ver conduta), pré-eclâmpsia.'},
 {t:'Emergência hipertensiva: nitroglicerina (SCA ou EAP)',rx:`1. Nitroglicerina 50 mg (10 mL) + SG 5% 240 mL (200 mcg/mL) — EV em bomba de infusão
   Iniciar 5–10 mcg/min (1,5–3 mL/h) e aumentar 10 mcg/min a cada 3–5 min até alívio dos sintomas ou PA alvo; máx. 200 mcg/min`,n:'Contraindicada com inibidor da PDE-5 recente, infarto de VD, PAS < 90. Cefaleia é comum. Usar frasco de vidro ou bolsa sem PVC.'},
 {t:'Dissecção de aorta',rx:`1. Metoprolol 5 mg (5 mL) — EV lento em 2 min; repetir a cada 5 min até FC < 60 bpm (máx. 15 mg)
   ou Esmolol: 500 mcg/kg EV em 1 min, depois 50–300 mcg/kg/min
2. Após betabloqueio, se PAS > 120 mmHg: Nitroprussiato (ver item acima)
3. Morfina para dor
4. Angio-TC de aorta e avaliação da cirurgia vascular/cardíaca imediata`,n:'Meta: FC < 60 bpm e PAS 100–120 mmHg em 20 min. Betabloqueio antes do vasodilatador (evita taquicardia reflexa).'},
 {t:'Pré-eclâmpsia grave / eclâmpsia',rx:`1. Sulfato de magnésio — esquema de Zuspan:
   Ataque: MgSO4 50% 8 mL (4 g) + água destilada 12 mL — EV em 15–20 min
   Manutenção: MgSO4 50% 10 mL (5 g) + SG 5% 490 mL — EV a 100 mL/h (1 g/h) em bomba, por 24 h após o parto ou a última crise
2. Hidralazina 20 mg/mL — diluir 1 ampola em 19 mL de água destilada (1 mg/mL)
   Fazer 5 mL (5 mg) EV se PA ≥ 160x110; repetir 5 mg a cada 20 min (máx. 30 mg)
   ou Nifedipino 10 mg VO, repetir a cada 20–30 min (máx. 30 mg)
3. Gluconato de cálcio 10% 10 mL à beira-leito (antídoto do magnésio)
4. Sonda vesical de demora; diurese horária; reflexo patelar e FR de 1/1 h`,n:'Suspender o magnésio se reflexo patelar abolido, FR < 16 irpm ou diurese < 25 mL/h. Insuficiência renal: manter só ataque ou reduzir manutenção. Avaliação obstétrica imediata.'}]},

rx_eap:{tipo:'h',g:'cv',t:'Edema agudo de pulmão / IC descompensada',rec:RH,rel:[['cd_eap','Conduta EAP']],items:[
 {t:'EAP hipertensivo / IC perfil quente e úmido',rx:`1. Cabeceira elevada a 45°, pernas pendentes
2. O2 para SpO2 ≥ 90%; VNI (CPAP 5–10 cmH2O ou BiPAP) se desconforto respiratório
3. Dinitrato de isossorbida 5 mg — SL, repetir a cada 5 min se PAS > 110 mmHg (até 3 doses)
4. Furosemida 20 mg (2 mL) — 40 mg EV (2 ampolas) em bolus; se já usa furosemida, dose EV de 1 a 2,5 vezes a dose oral diária
5. Nitroglicerina EV em bomba se PAS > 110 mmHg (ver crise hipertensiva)
6. Sonda vesical ou controle de diurese; meta > 100–150 mL/h nas primeiras 6 h
7. Balanço hídrico, peso diário, restrição hídrica 1–1,5 L/dia
8. Profilaxia de TEV: enoxaparina 40 mg SC 1 vez ao dia`,n:'Diurese < 100 mL/h em 2 h: dobrar a dose de furosemida. Hipotensão ou má perfusão (frio e úmido): inotrópico (dobutamina) e UTI; não usar nitrato. Morfina não é rotina.'}]},

rx_fa:{tipo:'h',g:'cv',t:'Fibrilação atrial e taquiarritmias',rec:RH,rel:[['cd_fa','Conduta FA'],['cha2ds2','CHA2DS2-VASc'],['acls','PCR e arritmias']],items:[
 {t:'FA com resposta ventricular alta, estável (controle de FC)',rx:`1. Metoprolol 5 mg (5 mL) — EV lento em 2 min; repetir a cada 5 min se necessário (máx. 15 mg)
   ou Diltiazem 25 mg — 0,25 mg/kg EV em 2 min (70 kg: ~17,5 mg); repetir 0,35 mg/kg após 15 min se necessário
2. Depois: metoprolol (tartarato) 25–50 mg VO de 12/12 h
3. Anticoagulação conforme CHA2DS2-VASc: enoxaparina 1 mg/kg SC de 12/12 h até definir anticoagulante oral`,n:'Evitar betabloqueador EV e diltiazem em IC com FE reduzida descompensada, hipotensão ou pré-excitação (WPW). Nesses casos: amiodarona ou digoxina (IC). Meta inicial FC < 110 bpm.'},
 {t:'FA com IC ou FE reduzida',rx:`1. Amiodarona 150 mg (3 mL) + SG 5% 100 mL — EV em 10–20 min
   Depois amiodarona 900 mg (6 ampolas) + SG 5% 500 mL — EV a 1 mg/min por 6 h (33 mL/h), depois 0,5 mg/min por 18 h (17 mL/h)
   ou Deslanosídeo 0,4 mg EV lento (digitálico), repetir 0,2 mg após 2–4 h se necessário`,n:'Amiodarona pode reverter a FA: se FA > 48 h e sem anticoagulação, há risco de embolia. Diluir só em SG 5%. Flebite em acesso periférico: preferir veia calibrosa.'},
 {t:'Cardioversão química da FA < 48 h (estável)',rx:`1. Amiodarona 300 mg + SG 5% 250 mL — EV em 1 h, depois 900 mg em 24 h
   ou Propafenona 600 mg VO dose única (sem cardiopatia estrutural, após betabloqueador ou bloqueador de canal de cálcio)
2. Enoxaparina 1 mg/kg SC antes da cardioversão`,n:'FA > 48 h ou tempo indeterminado: anticoagular 3 semanas antes ou ecocardiograma transesofágico. Instável (hipotensão, dor torácica isquêmica, EAP, rebaixamento): cardioversão elétrica sincronizada.'},
 {t:'Taquicardia supraventricular paroxística',rx:`1. Manobra vagal modificada (Valsalva em semirreclinado, depois deitar com pernas elevadas)
2. Adenosina 6 mg (2 mL) — EV rápido em veia calibrosa seguido de flush de 20 mL de SF; se não reverter: 12 mg; pode repetir 12 mg
3. Se refratária: metoprolol 5 mg EV ou diltiazem 0,25 mg/kg EV`,n:'Avisar o paciente sobre a sensação de mal-estar transitório da adenosina. Evitar em asma grave. Instável: cardioversão sincronizada 50–100 J.'}]},

rx_tev:{tipo:'h',g:'cv',t:'TEP e TVP',rec:RH,rel:[['cd_tep','Conduta TEP'],['wells_tep','Wells TEP'],['wells_tvp','Wells TVP']],items:[
 {t:'Anticoagulação plena (enoxaparina)',rx:`1. Enoxaparina 1 mg/kg — SC de 12/12 h
   (ClCr < 30: 1 mg/kg 1 vez ao dia; obesidade grave: ajustar com anti-Xa se disponível)
2. Hemograma e plaquetas a cada 2–3 dias`,n:'Contraindicações: sangramento ativo, plaquetas < 50 mil, cirurgia/AVC hemorrágico recente. Instável ou candidato a trombólise: preferir heparina não fracionada.'},
 {t:'Heparina não fracionada em bomba',rx:`1. Heparina 5.000 UI/mL — 80 UI/kg EV em bolus
2. Heparina 25.000 UI (5 mL) + SF 0,9% 245 mL (100 UI/mL) — EV em bomba a 18 UI/kg/h
3. TTPa 6 h após o início e a cada 6 h após cada ajuste; meta TTPa 1,5–2,5 vezes o controle`,n:'Preferir em DRC grave, alto risco de sangramento, possibilidade de procedimento ou trombólise. Antídoto: protamina 1 mg para cada 100 UI de heparina das últimas 2–3 h.'},
 {t:'TEP de alto risco (com choque): trombólise',rx:`1. Alteplase 100 mg — EV em 2 h (ou 0,6 mg/kg em 15 min, máx. 50 mg, na PCR/peri-PCR)
2. Suspender heparina durante a infusão; reiniciar quando TTPa < 2 vezes o controle
3. Noradrenalina se hipotensão; evitar expansão volêmica excessiva (> 500 mL)`,n:'Avaliar contraindicações (sangramento, AVC, cirurgia recente). Discutir com UTI.'},
 {t:'TVP/TEP de baixo risco: anticoagulante oral',rx:`1. Rivaroxabana 15 mg — VO de 12/12 h com alimento por 21 dias; depois 20 mg VO 1 vez ao dia
   ou Apixabana 10 mg VO de 12/12 h por 7 dias; depois 5 mg VO de 12/12 h`,n:'Não usar em gestante, SAF, ClCr < 30 (rivaroxabana < 15), hepatopatia grave. Duração mínima 3 meses. Ver também receitas de alta.'}]},

rx_avc:{tipo:'h',g:'neuro',t:'AVC isquêmico agudo',rec:RH,rel:[['cd_avc','Conduta AVC'],['nihss','NIHSS']],items:[
 {t:'Trombólise com alteplase',rx:`1. Alteplase 0,9 mg/kg (máx. 90 mg)
   10% da dose EV em bolus em 1 min; restante EV em bomba em 60 min
   (ex.: 70 kg = 63 mg: 6,3 mg em bolus + 56,7 mg em 1 h)
2. Manter PA < 180x105 mmHg por 24 h (antes da trombólise: < 185x110)
3. Sinais vitais e escala neurológica: 15/15 min nas 2 primeiras horas, 30/30 min até 6 h, 1/1 h até 24 h
4. Jejum; não puncionar artéria nem passar SNG ou sonda vesical nas primeiras 24 h, se possível
5. Sem antiagregante ou anticoagulante por 24 h; TC de controle em 24 h`,n:'Janela: até 4,5 h do último momento visto bem. Piora neurológica, cefaleia intensa, vômitos ou hipertensão aguda: parar a infusão e fazer TC urgente. Angioedema orolingual pode ocorrer (sobretudo com IECA).'},
 {t:'Trombólise com tenecteplase',rx:`1. Tenecteplase 0,25 mg/kg (máx. 25 mg) — EV em bolus único em 5 s
   (ex.: 70 kg = 17,5 mg)
2. Mesmos cuidados de PA, monitorização e restrições da alteplase`,n:'Atenção: a dose do AVC (0,25 mg/kg, máx. 25 mg) é diferente da dose do IAM.'},
 {t:'Controle de PA antes e após trombólise',rx:`1. Metoprolol 5 mg EV lento, repetir a cada 10 min se PA > 185x110 (máx. 15 mg)
   ou Nitroprussiato 0,3–3 mcg/kg/min em bomba (ver crise hipertensiva)
2. Sem trombólise: tratar só se PA > 220x120 mmHg, reduzindo 15% nas primeiras 24 h`,n:'Evitar hipotensão. Tratar febre (> 37,5 °C) e manter glicemia 140–180 mg/dL.'},
 {t:'AVC isquêmico sem trombólise',rx:`1. AAS 100 mg — 3 comprimidos (300 mg) VO agora (após TC sem sangramento e teste de deglutição), depois 100 mg/dia
2. AVC menor (NIHSS ≤ 3) ou AIT de alto risco: AAS + clopidogrel 300 mg de ataque, depois 75 mg/dia por 21 dias
3. Atorvastatina 40–80 mg VO à noite
4. Cabeceira a 0–30°, avaliação fonoaudiológica antes de dieta oral
5. Profilaxia de TEV: enoxaparina 40 mg SC 1 vez ao dia após 24 h`,n:'Se FA: anticoagulação após 1–14 dias, conforme o tamanho do infarto.'}]},

rx_asma:{tipo:'h',g:'resp',t:'Crise asmática',rec:RH,rel:[['cd_asma','Conduta asma'],['rx_alta_resp','Receitas de alta respiratórias']],items:[
 {t:'Crise leve a moderada',rx:`1. Salbutamol spray 100 mcg/jato — 4 a 10 jatos com espaçador a cada 20 min na 1ª hora
   ou Nebulização: fenoterol 10 gotas + ipratrópio 40 gotas + SF 0,9% 3–5 mL com O2 a 6–8 L/min — a cada 20 min, 3 vezes
2. Prednisona 20 mg — 2 comprimidos (40 mg) VO agora
3. O2 para SpO2 93–95%
4. Reavaliar após 1 h (FR, uso de musculatura, fala, SpO2, PFE)`,n:'Ipratrópio somado ao beta-2 na 1ª hora em crises moderadas a graves. Spray com espaçador é tão eficaz quanto nebulização e dá menos taquicardia.'},
 {t:'Crise grave',rx:`1. O2 para SpO2 93–95%
2. Salbutamol spray 100 mcg/jato 10 jatos com espaçador + ipratrópio spray 20 mcg/jato 4–8 jatos a cada 20 min na 1ª hora
   ou Nebulização: fenoterol 10 gotas + ipratrópio 40 gotas + SF 0,9% 3 mL a cada 20 min
3. Metilprednisolona 125 mg — EV agora
   ou Hidrocortisona 200 mg — EV agora
4. Sulfato de magnésio 50% 4 mL (2 g) + SF 0,9% 100 mL — EV em 20 min
5. Gasometria arterial; RX de tórax
6. Monitorização contínua; avaliar UTI`,n:'Sinais de iminência de parada (sonolência, confusão, tórax silencioso, bradicardia, pCO2 normal ou alta): preparar IOT (cetamina é a indução preferida).'}]},

rx_dpoc:{tipo:'h',g:'resp',t:'DPOC exacerbado',rec:RH,rel:[['cd_dpoc','Conduta DPOC']],items:[
 {t:'Exacerbação de DPOC',rx:`1. O2 por cateter nasal 1–2 L/min, alvo SpO2 88–92%
2. Nebulização: fenoterol 10 gotas + ipratrópio 40 gotas + SF 0,9% 3–5 mL com ar comprimido — a cada 20 min, 3 vezes, depois de 4/4 h
   ou Salbutamol spray 4–8 jatos + ipratrópio spray 4–8 jatos com espaçador
3. Prednisona 40 mg VO 1 vez ao dia por 5 dias
   ou Metilprednisolona 40 mg EV 1 vez ao dia (se não tolera VO)
4. Antibiótico se escarro purulento ou VNI/IOT:
   Amoxicilina + clavulanato 875/125 mg VO de 12/12 h por 5–7 dias
   ou Ceftriaxona 1 g EV 1 vez ao dia (internado) ± azitromicina 500 mg/dia
5. Gasometria arterial
6. VNI (BiPAP) se pH < 7,35 e pCO2 > 45 mmHg`,n:'Não usar O2 em alto fluxo sem necessidade (risco de hipercapnia). Nebulizar com ar comprimido em retentores de CO2.'}]},

rx_anaf:{tipo:'h',g:'osteo',t:'Anafilaxia e alergia',rec:RH,rel:[['cd_anaf','Conduta anafilaxia']],items:[
 {t:'Anafilaxia',rx:`1. Adrenalina 1 mg/mL — 0,5 mL (0,5 mg) IM na face anterolateral da coxa, agora
   Repetir a cada 5–15 min se não melhorar (criança: 0,01 mg/kg, máx. 0,3–0,5 mg)
2. Decúbito dorsal com MMII elevados (gestante: decúbito lateral esquerdo; dispneia: sentado)
3. O2 6–10 L/min por máscara
4. SF 0,9% 1.000 mL EV rápido se hipotensão (criança: 20 mL/kg); repetir conforme resposta
5. Adjuvantes (não substituem a adrenalina):
   Prometazina 25 mg/mL — 2 mL (50 mg) IM ou difenidramina 50 mg EV lento
   Hidrocortisona 200 mg EV ou metilprednisolona 125 mg EV
6. Broncoespasmo persistente: salbutamol spray 4–8 jatos ou fenoterol nebulizado
7. Refratária (após 2 doses IM e volume): adrenalina 1 mg + SF 0,9% 100 mL (10 mcg/mL) EV em bomba a 0,1 mcg/kg/min, titulando
8. Em uso de betabloqueador e refratária: glucagon 1–5 mg EV em 5 min`,n:'Observação mínima de 6 h (12–24 h se grave, bifásica prévia, asma ou precisou de mais de 1 dose de adrenalina). Alta com receita de anti-histamínico e encaminhamento ao alergista.'},
 {t:'Urticária aguda e angioedema sem anafilaxia',rx:`1. Prometazina 25 mg/mL — 2 mL (50 mg) IM
   ou Dexclorfeniramina 2 mg VO
2. Hidrocortisona 100–200 mg EV ou dexametasona 4–10 mg EV/IM se extenso
3. Observar 1–2 h`,n:'Angioedema sem urticária em usuário de IECA: bradicinina, não responde a anti-histamínico/corticoide/adrenalina como na alergia. Suspender o IECA e vigiar a via aérea; considerar plasma fresco ou icatibanto se grave.'}]},

rx_colica:{tipo:'h',g:'renal',t:'Cólica renal',rec:RH,rel:[['an_colrenal','Anamnese'],['rx_alta_uro','Receita de alta']],items:[
 {t:'Cólica renal',rx:`1. Dipirona 1 g (2 mL) + água destilada 8 mL — EV lento agora
2. Cetoprofeno 100 mg + SF 0,9% 100 mL — EV em 20 min agora (se função renal normal)
3. Ondansetrona 8 mg EV se náusea
4. Se dor persistente após 30–60 min: Tramadol 100 mg + SF 0,9% 100 mL EV em 30 min
   ou Morfina 2–4 mg EV (ver analgesia)
5. Hidratação apenas para corrigir desidratação (sem hiper-hidratação)`,n:'AINE é o analgésico de 1ª linha. Evitar AINE em DRC, gestante e se TFG desconhecida em idoso. Escopolamina não tem benefício comprovado na cólica renal.'}]},

rx_cef:{tipo:'h',g:'neuro',t:'Cefaleia e enxaqueca',rec:RH,rel:[['cd_cef','Conduta cefaleia']],items:[
 {t:'Crise de enxaqueca no PS',rx:`1. Dipirona 1 g (2 mL) + água destilada 8 mL — EV lento
2. Metoclopramida 10 mg (2 mL) + SF 0,9% 100 mL — EV em 15 min
3. Dexametasona 10 mg — EV (reduz recorrência em 72 h)
4. Se sem melhora em 1 h: Cetoprofeno 100 mg + SF 0,9% 100 mL EV em 20 min
   ou Sumatriptano 6 mg SC (sem doença coronariana/cerebrovascular, HAS não controlada, gestação)
5. Refratária: Clorpromazina 0,1 mg/kg (máx. 25 mg) + SF 0,9% 100 mL — EV em 30 min, após 500 mL de SF 0,9%`,n:'Evitar opioide na enxaqueca (piora resposta e cronifica). Clorpromazina: risco de hipotensão postural, deixar o paciente deitado. Enxaqueca > 72 h (estado de mal): dexametasona + bloqueio do nervo occipital maior.'},
 {t:'Cefaleia tensional',rx:`1. Dipirona 1 g EV ou VO
   ou Ibuprofeno 600 mg VO / Cetoprofeno 100 mg EV`,n:'Sem sinais de alarme não precisa de exame de imagem.'}]},

rx_vert:{tipo:'h',g:'neuro',t:'Vertigem',rec:RH,rel:[['cd_vert','Conduta vertigem']],items:[
 {t:'Crise de vertigem (síndrome vestibular aguda ou VPPB)',rx:`1. Dimenidrinato 30 mg + piridoxina 50 mg (1 ampola de 10 mL) + SF 0,9% 100 mL — EV em 20 min, de 6/6 h se necessário
   ou Dimenidrinato 50 mg + piridoxina 50 mg (1 ampola de 1 mL) — IM
2. Ondansetrona 8 mg EV se náusea persistente
3. Se refratária: Diazepam 5 mg EV lento ou VO
4. Hidratação se vômitos`,n:'Sintomáticos vestibulares só por até 3 dias (atrasam a compensação). VPPB: manobra de Epley. HINTS sugestivo de AVC (impulso cefálico normal, nistagmo que muda de direção, skew deviation) ou déficit neurológico: imagem e protocolo de AVC.'}]},

rx_gea:{tipo:'h',g:'dig',t:'Gastroenterite e desidratação',rec:RH,rel:[['an_gea','Anamnese'],['rx_alta_gea','Receita de alta']],items:[
 {t:'Desidratação leve a moderada',rx:`1. Terapia de reidratação oral: SRO 50–100 mL/kg em 4 h, em pequenos volumes
2. Ondansetrona 8 mg EV ou 8 mg VO (comprimido orodispersível)
3. Escopolamina 20 mg + SF 0,9% 100 mL EV se cólica
4. Dipirona 1 g EV se dor ou febre
5. Teste de aceitação oral após medicação`,n:'Tentar hidratação oral primeiro. Sinais de alarme: sangue nas fezes com febre alta, idoso, imunossuprimido, desidratação grave, abdome agudo.'},
 {t:'Desidratação grave (adulto)',rx:`1. SF 0,9% ou Ringer lactato 20–30 mL/kg (1.000–2.000 mL) — EV rápido; reavaliar após cada 500 mL
2. Depois: manutenção e reposição de perdas (SF 0,9% 500 mL + SG 5% 500 mL de 8/8 h)
3. Ondansetrona 8 mg EV de 8/8 h
4. Função renal, eletrólitos, gasometria venosa
5. Repor K conforme exame (não repor se oligúria)`,n:'Cuidado com hidratação rápida em IC, DRC e idosos frágeis: reavaliar ausculta e diurese a cada etapa.'}]},

rx_hda:{tipo:'h',g:'dig',t:'Hemorragia digestiva alta',rec:RH,rel:[['cd_hda','Conduta HDA'],['gbs','Glasgow-Blatchford']],items:[
 {t:'HDA não varicosa',rx:`1. Dieta zero; cabeceira elevada; 2 acessos venosos calibrosos
2. Ringer lactato ou SF 0,9% 500 mL EV rápido se instável; reavaliar
3. Omeprazol 80 mg EV em bolus; depois 40 mg EV de 12/12 h (ou 8 mg/h em bomba)
4. Concentrado de hemácias se Hb < 7 g/dL (< 8 se doença cardiovascular ou instabilidade)
5. Suspender AAS/AINE/anticoagulante; reverter anticoagulação se sangramento grave
6. EDA em até 24 h (até 12 h se instável após ressuscitação)`,n:'Metoclopramida 10 mg EV ou eritromicina 250 mg EV 30–120 min antes da EDA melhora a visualização.'},
 {t:'HDA varicosa (suspeita em hepatopata)',rx:`1. Dieta zero; 2 acessos calibrosos; proteção de via aérea se rebaixado ou hematêmese volumosa
2. Terlipressina 1 mg/5 mL — 2 mg EV de 4/4 h (1 mg se < 50 kg); após controle, 1 mg de 4/4 h, por 2–5 dias
   ou Octreotida 50 mcg EV em bolus + 50 mcg/h em bomba
3. Ceftriaxona 1 g EV 1 vez ao dia por 7 dias (profilaxia de PBE)
4. Omeprazol 80 mg EV até a EDA
5. Transfusão restritiva: Hb alvo 7–8 g/dL (evitar hipervolemia)
6. Lactulose 20 mL VO/SNG de 8/8 h (prevenção de encefalopatia)
7. EDA em até 12 h`,n:'Terlipressina: cuidado em coronariopatia e doença arterial periférica (isquemia). Sangramento incontrolável: balão de Sengstaken-Blakemore como ponte.'}]},

rx_panc:{tipo:'h',g:'dig',t:'Pancreatite aguda',rec:RH,rel:[['cd_pancr','Conduta pancreatite']],items:[
 {t:'Pancreatite aguda leve a moderada',rx:`1. Dieta oral com baixo teor de gordura assim que tolerar (não manter jejum prolongado)
2. Ringer lactato — 10 mL/kg EV em 1 h se hipovolemia; depois 1,5 mL/kg/h; reavaliar em 12 h (evitar hidratação agressiva)
3. Dipirona 1 g EV de 6/6 h fixo
4. Tramadol 100 mg EV de 8/8 h se dor ou Morfina 2–4 mg EV de 4/4 h se dor intensa
5. Ondansetrona 8 mg EV de 8/8 h se náusea
6. Enoxaparina 40 mg SC 1 vez ao dia
7. Exames: hemograma, Ur, Cr, eletrólitos, Ca, glicemia, TGO, TGP, bilirrubinas, triglicerídeos, PCR, gasometria; USG de abdome (litíase)`,n:'Antibiótico profilático não é indicado. Pancreatite biliar com colangite: CPRE em 24 h. Avaliar gravidade (falência orgânica > 48 h = grave).'}]},

rx_cad:{tipo:'h',g:'endo',t:'Cetoacidose e estado hiperosmolar',rec:RH,rel:[['cd_cad','Conduta CAD'],['angap','Ânion gap'],['nacorr','Sódio corrigido']],items:[
 {t:'Cetoacidose diabética (adulto)',rx:`1. Dieta zero inicialmente; monitorização; 2 acessos venosos

   Depois 250–500 mL/h: SF 0,45% se Na corrigido normal ou alto; SF 0,9% se Na corrigido baixo
3. Quando glicemia < 200 mg/dL: SG 5% + SF 0,45% (ou SG 5% 500 mL + NaCl 20% 10 mL) a 150–250 mL/h
4. Potássio:
   K < 3,3: KCl 19,1% 10–20 mL (25–50 mEq) em SF 0,9% 500 mL — EV em 1–2 h ANTES da insulina
   K 3,3–5,2: KCl 19,1% 8–12 mL (20–30 mEq) em cada litro de soro
   K > 5,2: não repor; dosar de 2/2 h
5. Insulina regular 100 UI + SF 0,9% 100 mL (1 UI/mL) — EV em bomba a 0,1 UI/kg/h (ou 0,14 UI/kg/h sem bolus)
   Meta de queda da glicemia 50–75 mg/dL/h; se cair menos de 10% na 1ª h, dar bolus 0,14 UI/kg
   Quando glicemia < 200 mg/dL: reduzir para 0,02–0,05 UI/kg/h e manter glicemia 150–200 mg/dL
6. Bicarbonato apenas se pH < 6,9: NaHCO3 8,4% 100 mL + água destilada 400 mL + KCl 19,1% 8 mL — EV em 2 h
7. HGT de 1/1 h; Na, K, Cl, glicemia e gasometria venosa de 2/2 h a 4/4 h; fósforo e magnésio
8. Tratar fator precipitante`,n:'Resolução: glicemia < 200 + 2 de: HCO3 ≥ 15, pH venoso > 7,3, ânion gap ≤ 12. Transição: insulina SC (NPH + regular) e manter a bomba por mais 2 h. CAD euglicêmica com iSGLT2: usar soro glicosado desde o início.'},
 {t:'Estado hiperglicêmico hiperosmolar',rx:`1. SF 0,9% 1.000–1.500 mL EV na 1ª hora; depois conforme Na corrigido e diurese (geralmente 250–500 mL/h)
2. Potássio como na CAD
3. Insulina regular EV em bomba 0,05–0,1 UI/kg/h, iniciada após a hidratação inicial (a hidratação sozinha já reduz a glicemia)
4. Quando glicemia < 300 mg/dL: SG 5% + SF 0,45% e reduzir insulina para 0,02–0,05 UI/kg/h, manter glicemia 250–300 mg/dL
5. Osmolaridade: queda de no máximo 3–8 mOsm/kg/h; Na corrigido não cair mais que 10 mEq/L/24 h
6. Enoxaparina 40 mg SC (alto risco de trombose)`,n:'Cuidado com edema cerebral por queda rápida da osmolaridade. Idosos: buscar IAM, AVC e infecção.'}]},

rx_hipo:{tipo:'h',g:'endo',t:'Hipoglicemia',rec:RH,rel:[['cd_hipo','Conduta hipoglicemia']],items:[
 {t:'Hipoglicemia',rx:`Consciente: 15 g de carboidrato VO (1 copo de suco ou 1 colher de sopa de açúcar); repetir HGT em 15 min
Rebaixado ou sem via oral:

rx_ele:{tipo:'h',g:'renal',t:'Distúrbios do potássio e sódio',rec:RH,rel:[['cd_k','Conduta hipercalemia'],['cd_na','Conduta hiponatremia'],['nadef','Correção do sódio']],items:[
 {t:'Hipercalemia (K ≥ 6,0 ou alteração no ECG)',rx:`1. Monitorização cardíaca; ECG
2. Gluconato de cálcio 10% 10 mL (1 g) + SF 0,9% 100 mL — EV em 5–10 min se alteração no ECG; repetir em 5 min se persistir (até 3 vezes)

5. Bicarbonato de sódio 8,4% 100 mL EV em 30 min, se acidose metabólica

8. Diálise se refratária, IRA oligúrica ou K > 7 com insuficiência renal
9. Repetir K em 2 h; suspender IECA, BRA, espironolactona, AINE, suplemento de K`,n:'O cálcio estabiliza a membrana mas não baixa o K (efeito de 30–60 min). Insulina e beta-2 baixam 0,5–1 mEq/L em 30–60 min.'},
 {t:'Hipocalemia',rx:`Leve (3,0–3,4) sem sintomas: KCl xarope 6% 15 mL VO de 8/8 h (ou KCl 600 mg 2 comprimidos de 8/8 h)
Moderada a grave (< 3,0) ou sintomática:

2. Sulfato de magnésio 10% 10 mL (1 g) + SF 0,9% 100 mL EV em 1 h, se Mg baixo
3. Repetir K em 4–6 h`,n:'Concentração máxima em veia periférica: 40 mEq/L (até 60 mEq/L em situações selecionadas). Evitar soro glicosado na diluição (a glicose baixa mais o K).'},
 {t:'Hiponatremia grave sintomática',rx:`1. Preparo de NaCl 3%: SF 0,9% 890 mL + NaCl 20% 110 mL (513 mEq/L)
2. NaCl 3% 150 mL — EV em 20 min (criança: 2 mL/kg); repetir até 2 vezes, dosando Na a cada bolus
3. Meta: subir 4–6 mEq/L nas primeiras horas ou até cessar os sintomas
4. Limite: não subir mais que 8–10 mEq/L em 24 h (8 se alcoolismo, desnutrição, hipocalemia, cirrose)
5. Na de 4/4 h; diurese horária`,n:'Sintomas graves: convulsão, rebaixamento, vômitos persistentes, sofrimento respiratório. Se correção exceder o limite: SG 5% 3–6 mL/kg ± desmopressina 2 mcg EV (relowering). Ver calculadora de correção de sódio.'}]},

rx_conv:{tipo:'h',g:'neuro',t:'Crise convulsiva e estado de mal',rec:RH,rel:[['cd_conv','Conduta crise convulsiva']],items:[
 {t:'Crise > 5 min ou crises repetidas',rx:`0–5 min: decúbito lateral, aspirar, O2, HGT, acesso venoso

4. Manutenção: fenitoína 100 mg EV de 8/8 h após 8–12 h`,n:'Fenitoína: só em SF (precipita em glicose), não fazer IM, risco de hipotensão, bradicardia e flebite. Eclâmpsia: sulfato de magnésio. Estado de mal refratário (> 30–40 min): IOT e midazolam ou propofol contínuo na UTI.'}]},

rx_agit:{tipo:'h',g:'mental',t:'Agitação psicomotora',rec:RH,rel:[['cd_agit','Conduta agitação']],items:[
 {t:'Agitação psicótica ou maníaca',rx:`1. Abordagem verbal e oferta de medicação VO primeiro: Haloperidol 5 mg VO ou Risperidona 2 mg VO

 {t:'Delirium no idoso',rx:`1. Tratar a causa (infecção, retenção urinária, dor, fecaloma, medicação, hipóxia, distúrbio metabólico)

   ou Quetiapina 12,5–25 mg VO à noite (Parkinson/demência com corpos de Lewy)`,n:'Evitar benzodiazepínico no delirium (piora), exceto abstinência alcoólica.'},
 {t:'Abstinência alcoólica',rx:`1. Tiamina 100–300 mg EV ou IM 1 vez ao dia (antes de soro glicosado)

rx_sepse:{tipo:'h',g:'inf',t:'Sepse: antibiótico empírico por foco',rec:RH,rel:[['cd_sepse','Conduta sepse'],['qsofa','qSOFA']],items:[

 {t:'Pneumonia comunitária grave',rx:`1. Ceftriaxona 2 g — EV 1 vez ao dia (ou 1 g de 12/12 h)

   Fasceíte: Piperacilina-tazobactam 4,5 g EV de 6/6 h + Clindamicina 600–900 mg EV de 8/8 h + Vancomicina se risco de MRSA

5. Isolamento respiratório (gotículas) por 24 h`,n:'Não atrasar o antibiótico pela TC ou punção. TC antes da punção se: déficit focal, papiledema, convulsão nova, imunossupressão, Glasgow < 10.'},

rx_pele:{tipo:'h',g:'osteo',t:'Celulite, erisipela e abscesso',rec:RH,rel:[['an_pele','Anamnese'],['rx_alta_pele','Receitas de alta']],items:[

rx_antid:{tipo:'h',g:'mental',t:'Intoxicações: antídotos',rec:RH,rel:[['cd_intox','Conduta intoxicações']],items:[

 {t:'Paracetamol',rx:`N-acetilcisteína EV (esquema de 21 h):

 {t:'Organofosforado / carbamato (síndrome colinérgica)',rx:`1. Descontaminação da pele (retirar roupas, lavar com água e sabão); proteção da equipe

5. Diazepam para convulsão`,n:'Alvo da atropinização: pulmões limpos, FC > 80, PAS > 80, pupilas sem miose, pele seca. Taquicardia não é contraindicação.'},

 {t:'Betabloqueador / bloqueador de canal de cálcio',rx:`1. Atropina 1 mg EV (efeito limitado)

 {t:'Outros antídotos',rx:`Varfarina com sangramento grave: Vitamina K 10 mg EV lento + complexo protrombínico 25–50 UI/kg (ou plasma 15 mL/kg)

Isoniazida: Piridoxina 1 g para cada grama ingerido (máx. 5 g) EV`,n:'Dúvidas: CIATox 0800 722 6001 (24 h).'},
 {t:'Descontaminação',rx:`1. Carvão ativado 1 g/kg (máx. 50 g) diluído em 250 mL de água ou SF — VO ou por SNG, dose única

function fieldsHTML(f,pre){return `<div class="grid2">${f.map(x=>x.o?`<div class="field"><label for="${pre}-${x.k}">${esc(x.l)}</label><select id="${pre}-${x.k}">${x.o.map(o=>`<option value="${o[0]}"${o[0]===x.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`:`<div class="field"><label for="${pre}-${x.k}">${esc(x.l)}</label><input id="${pre}-${x.k}" inputmode="decimal" value="${x.v||''}"></div>`).join('')}</div>`}
function readF(f,pre){const v={};f.forEach(x=>{const e=$('#'+pre+'-'+x.k);v[x.k]=x.o?e.value:num(e.value)});return v}

/* Gasometria: interpretador */
FN.gasocalc={g:'renal',t:'Interpretador de gasometria',code:'arterial',k:'gasometria interpretar acidose alcalose winter',render(m){
  const F=[{k:'ph',l:'pH',v:'7,25'},{k:'pco2',l:'pCO2 (mmHg)',v:'28'},{k:'hco3',l:'HCO3 (mEq/L)',v:'12'},{k:'na',l:'Na (mEq/L)',v:'138'},{k:'cl',l:'Cl (mEq/L)',v:'104'},{k:'alb',l:'Albumina (g/dL) — opcional',v:''},{k:'po2',l:'pO2 (mmHg) — opcional',v:''},{k:'fio2',l:'FiO2 (%) — opcional',v:'21'}];
  m.innerHTML=`<section class="panel"><div class="ph"><h2>Interpretador de gasometria</h2><span class="code">passo a passo automático</span></div>
   <div class="card">${fieldsHTML(F,'gs')}<p class="ex">Exemplo: substitua pelos dados do paciente</p></div>${resultBox('gs-r')}${copyBtn()}
   <p class="note">Ferramenta de apoio: confira com a clínica. Distúrbios triplos podem não ser identificados.</p></section>`;
  let line='';const upd=()=>{const v=readF(F,'gs'),r=$('#gs-r');if(!(v.ph>6.5&&v.ph<8&&v.pco2>0&&v.hco3>0)){r.className='result';r.innerHTML='<div class="sub">Preencha pH, pCO2 e HCO3.</div>';line='';return}
   const L=[];let prim='',cls='warn';const ac=v.ph<7.35,al=v.ph>7.45;
   if(ac){const me=v.hco3<22,re=v.pco2>45;prim=me&&re?'misto_ac':me?'met_ac':re?'resp_ac':'ind'}
   else if(al){const me=v.hco3>26,re=v.pco2<35;prim=me&&re?'misto_al':me?'met_al':re?'resp_al':'ind'}
   else{prim=(v.pco2<35&&v.hco3<22)||(v.pco2>45&&v.hco3>26)?'misto_n':'normal'}
   const N={met_ac:'Acidose metabólica',resp_ac:'Acidose respiratória',misto_ac:'Acidose mista (metabólica + respiratória)',met_al:'Alcalose metabólica',resp_al:'Alcalose respiratória',misto_al:'Alcalose mista (metabólica + respiratória)',misto_n:'pH normal com pCO2 e HCO3 alterados: distúrbio misto compensando-se',normal:'Gasometria sem distúrbio ácido-base',ind:'Valores incoerentes: confira pH, pCO2 e HCO3'};
   if(prim==='normal')cls='ok';if(/misto|ac/.test(prim)&&v.ph<7.2)cls='bad';
   if(prim==='met_ac'){const e=1.5*v.hco3+8;L.push(`Compensação (Winter): pCO2 esperada <b>${fmt(e-2,0)}–${fmt(e+2,0)}</b> mmHg → ${v.pco2>e+2?'<b>acidose respiratória associada</b>':v.pco2<e-2?'<b>alcalose respiratória associada</b>':'compensação adequada'}.`)}
   if(prim==='met_al'){const e=0.7*v.hco3+21;L.push(`pCO2 esperada <b>${fmt(e-2,0)}–${fmt(e+2,0)}</b> mmHg → ${v.pco2>e+2?'acidose respiratória associada':v.pco2<e-2?'alcalose respiratória associada':'compensação adequada'}.`)}
   if(prim==='resp_ac'){const d=(v.pco2-40)/10;L.push(`HCO3 esperado: aguda <b>${fmt(24+d,0)}</b>, crônica <b>${fmt(24+3.5*d,0)}</b> mEq/L → ${v.hco3<24+d-2?'acidose metabólica associada':v.hco3>24+4*d+2?'alcalose metabólica associada':v.hco3<24+2*d?'padrão de distúrbio agudo':'padrão de distúrbio crônico'}.`)}
   if(prim==='resp_al'){const d=(40-v.pco2)/10;L.push(`HCO3 esperado: aguda <b>${fmt(24-2*d,0)}</b>, crônica <b>${fmt(24-4.5*d,0)}</b> mEq/L → ${v.hco3<24-5*d-2?'acidose metabólica associada':v.hco3>24-2*d+2?'alcalose metabólica associada':v.hco3>24-3*d?'padrão agudo':'padrão crônico'}.`)}
   if(v.na>0&&v.cl>0){const ag=v.na-(v.cl+v.hco3),agc=v.alb>0?ag+2.5*(4-v.alb):ag;L.push(`Ânion gap${v.alb>0?' corrigido':''}: <b>${fmt(agc,1)}</b> ${agc>12?'(aumentado)':'(normal)'}`);
    if(agc>12&&v.hco3<24){const dd=(agc-12)/(24-v.hco3);L.push(`Delta-delta: <b>${fmt(dd,2)}</b> → ${dd<1?'acidose de AG normal associada':dd<=2?'acidose de AG aumentado pura':'alcalose metabólica associada'}`)}
    else if(agc>12&&!/met_ac|misto_ac/.test(prim))L.push('AG aumentado mesmo sem acidemia: há acidose metabólica oculta.');
    if(/met_ac|misto_ac/.test(prim))L.push(agc>12?'Causas de AG alto: cetoacidose, lactato, IRA, metanol, etilenoglicol, salicilato.':'AG normal: diarreia, ATR, excesso de SF 0,9%.')}
   if(v.po2>0&&v.fio2>0){const fi=v.fio2/100,pf=v.po2/fi,aa=fi*713-v.pco2/0.8-v.po2;L.push(`P/F: <b>${fmt(pf,0)}</b> ${pf<100?'(grave)':pf<200?'(moderada)':pf<300?'(leve)':'(normal)'} · gradiente A-a: <b>${fmt(aa,0)}</b> mmHg`)}
   r.className='result '+cls;r.innerHTML=`<div class="big" style="font-size:1.15rem">${N[prim]}</div>${L.map(x=>`<div class="sub">${x}</div>`).join('')}`;
   line=`Gasometria: pH ${fmt(v.ph,2)}, pCO2 ${fmt(v.pco2,0)}, HCO3 ${fmt(v.hco3,1)}. ${N[prim]}. `+L.map(x=>strip(x)).join(' ')};
  m.querySelectorAll('input,select').forEach(e=>{e.oninput=upd;e.onchange=upd});upd();bindCopy(()=>line)}};

function profGet(){return {medico:store.get('kitps:medico')||'',crm:store.get('kitps:crm')||'',unidade:store.get('kitps:unidade')||'',cidade:store.get('kitps:cidade')||''}}

  const sh=$('#sheet');sh.innerHTML=`<div class="ath">${esc(p.unidade||'Pronto Socorro')}</div><div class="att">${/Controle Especial/.test(rec||'')?'RECEITUÁRIO DE CONTROLE ESPECIAL':'RECEITUÁRIO'}</div>
   <div class="rxpac"><b>Paciente:</b><span></span></div><pre class="rxp">${esc(txt)}</pre>
   <div class="atf">${esc(p.cidade||'________________')}, ${d.getDate()} de ${mes[d.getMonth()]} de ${d.getFullYear()}.<br><br>_______________________________________<br>${esc(p.medico||'Médico(a)')}${p.crm?' · CRM '+esc(p.crm):''}</div>`;

      <div class="edf" id="ed-${i}" hidden><textarea class="soap rxta" spellcheck="false" aria-label="Editar ${esc(it.t)}"></textarea><div class="bar"><button class="btn primary small" data-sv="${i}" type="button">Salvar</button><button class="btn small" data-x="${i}" type="button">Cancelar</button><button class="btn small danger" data-rs="${i}" type="button">Restaurar original</button></div></div>
      ${it.n?`<p class="note">${esc(it.n)}</p>`:''}${it.rec?`<p class="note"><b>Receituário:</b> ${esc(it.rec)}</p>`:''}</article>`).join('')}

function renderSC(m,id){
  const s=SC[id];
  const body=s.kind==='ck'
    ?`<div class="card"><div class="opts" style="grid-template-columns:1fr">${s.ck.map((c,i)=>`<label class="opt"><input type="checkbox" id="sc-${i}"><span><i>${c[1]>0?'+':''}${String(c[1]).replace('.',',')}</i>${esc(c[0])}</span></label>`).join('')}</div></div>`
    :s.q.map((q,i)=>`<fieldset class="q"><legend><b>${i+1}.</b> ${esc(q.q)}</legend><div class="opts"${q.o.some(o=>o[0].length>28)?' style="grid-template-columns:1fr"':''}>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="sc-${i}" value="${j}"><span><i>${o[1]}</i>${esc(o[0])}</span></label>`).join('')}</div></fieldset>`).join('');
  m.innerHTML=`<section class="panel"><div class="ph"><h2>${esc(s.t)}</h2><span class="code">${esc(s.code)}</span></div>
    ${resultBox('sc-r')}${body}${copyBtn()}<div class="bar"><button class="btn small" id="clr" type="button">Limpar respostas</button></div>
    ${s.note?`<p class="note">${esc(s.note)}</p>`:''}</section>`;
  let line='';
  const upd=()=>{let t=0,ans=0;const v=[],pos=[];
    if(s.kind==='ck')s.ck.forEach((c,i)=>{if($('#sc-'+i).checked){t+=c[1];pos.push(c[0])}});
    else s.q.forEach((q,i)=>{const r=m.querySelector(`input[name="sc-${i}"]:checked`);if(!r){v.push(null);return}ans++;const o=q.o[+r.value];v.push(o[1]);t+=o[1];if(o[1])pos.push(q.q.replace(/\?$/,'')+': '+o[0])});
    const r=$('#sc-r'),n=s.kind==='q'?s.q.length:0;
    if(s.kind==='q'&&!ans){r.className='result';r.innerHTML='<div class="sub">Marque as respostas.</div>';line='';return}
    t=Math.round(t*10)/10;const [cls,tit,txt]=s.lv(t,v),u=s.unit!=null?s.unit:(Math.abs(t)===1?' ponto':' pontos'),tt=String(t).replace('.',',');
    r.className='result '+cls;r.innerHTML=`<div class="big">${s.unit===''?'':tt}<small>${esc(u)}</small></div><div class="sub"><b>${esc(tit)}</b>${n&&ans<n?` · faltam ${n-ans} de ${n} respostas`:''}</div>${txt?`<div class="sub">${esc(txt)}</div>`:''}`;
    line=`${s.t}: ${s.unit===''?'':tt+u+' '}(${tit}).${pos.length?' Itens: '+pos.join('; ')+'.':''}`};
  m.querySelectorAll('input').forEach(i=>i.onchange=upd);upd();bindCopy(()=>line);
  $('#clr').onclick=()=>{m.querySelectorAll('input').forEach(i=>i.checked=false);upd()}}

function render(){
  const m=$('#main'),s=secOf(cur.id);
  if(s==='ini')return renderINI(m);if(s==='meu')return renderMEU(m);
  if(s==='an')return renderAN(m,cur.id);if(s==='rx')return renderRX(m,cur.id);
  if(s==='cd'||s==='ex')return renderGD(m,cur.id);if(s==='sc')return renderSC(m,cur.id);
  if(s==='nc')return renderNC(m,cur.id);if(s==='fn')return FN[cur.id].render(m)}

function renderMenu(){

     <div class="msub" id="ms-${s.k}"${op?'':' hidden'}>${secList(s).map(id=>{const gg=gOf(id),hd=grouped(s)&&gg!==lg?`<div class="sgh" data-g="${gg}">${esc(GRP[gg][1])}</div>`:'';lg=gg;return hd+`<button class="msi" type="button" data-s="${s.k}" data-id="${id}" data-g="${gg}" aria-current="${s.k===CURS&&id===cur.id}">${esc(chipLabel(id))}</button>`}).join('')}</div>`});

  nav.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const k=b.dataset.x,op=!MOPEN.has(k);op?MOPEN.add(k):MOPEN.delete(k);store.set('kitps:mopen',JSON.stringify([...MOPEN]));b.setAttribute('aria-expanded',op);$('#ms-'+k).hidden=!op});
  $('#sec-name').innerHTML=icon(SECM[CURS].ic,18)+'<span>'+esc(SECM[CURS].t)+'</span>'}
function openSection(k){const s=SECM[k];CURS=k;store.set('kitps:sec',k);const last=store.get('kitps:lasts-'+k);go(last&&s.ids.includes(last)?last:secList(s)[0],k)}

function closeMenu(){document.body.classList.remove('menu-open');$('#menu-btn').setAttribute('aria-expanded','false')}
function renderFavs(){const f=$('#favs');f.hidden=!FAV.length;

  const c=$('#chips');c.innerHTML='';const s=SECM[CURS],list=secList(s),gr=grouped(s);let lg='';

function setHH(){const h=$('header');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}
function go(id,sk){
  if(!known(id))id='inicio';cur={id};
  if(sk&&SECM[sk]&&SECM[sk].ids.includes(id))CURS=sk;
  else if(!SECM[CURS].ids.includes(id)){const s=SECTIONS.find(s=>s.ids.includes(id));if(s)CURS=s.k}
  store.set('kitps:sec',CURS);store.set('kitps:lasts-'+CURS,id);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  renderChips();render();addHead();addStar();setHH();
  const ch=document.getElementById('chip-'+id);if(ch&&ch.scrollIntoView)ch.scrollIntoView({block:'nearest',inline:'nearest'});
  window.scrollTo(0,0)}

let IDX=null;
function buildIdx(){const L=[];
  SECTIONS.forEach(s=>s.ids.forEach(id=>{if(L.some(e=>e.id===id&&e.i==null))return;const x=item(id);if(!x)return;
    const body=x.body||(x.sec?x.sec.map(gdText).join(' '):'')+(x.items?x.items.map(it=>it.t).join(' '):'')+(x.k||'')+(x.code||'');
    L.push({id,lab:x.t,sec:s.t,sub:x.code||x.src||'',key:norm(x.t+' '+body+' '+s.t)});
    if(x.items)x.items.forEach((it,i)=>L.push({id,i,lab:it.t,sec:x.tipo==='a'?'Receita de alta':'Prescrição',sub:x.t,key:norm(it.t+' '+it.rx+' '+x.t+' '+(it.n||''))}))}));
  return L}
function searchKit(q){IDX=IDX||buildIdx();const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];
  return IDX.map(e=>{if(!toks.every(t=>e.key.includes(t)))return null;const l=norm(e.lab);let sc=0;toks.forEach(t=>{if(l.startsWith(t))sc+=4;else if(l.includes(t))sc+=2});if(e.i==null)sc+=1;return [sc,e]}).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,14).map(x=>x[1])}
function openResult(e){$('#q').value='';$('#qres').hidden=true;$('#q').blur();go(e.id);if(e.i!=null)focusCard('#rxa-'+e.i)}

  const q=$('#q'),box=$('#qres');let res=[];
  const draw=()=>{res=searchKit(q.value);if(!q.value.trim()){box.hidden=true;return}
    box.innerHTML=res.length?res.map((e,k)=>`<button class="qr" data-k="${k}" role="option"><span class="qs">${esc(e.sec)}</span><span class="ql">${esc(e.lab)}</span>${e.sub?`<span class="qd">${esc(e.sub)}</span>`:''}</button>`).join(''):'<div class="qr none">Nada encontrado. Tente outro termo (ex.: noradrenalina, sepse, potássio).</div>';
    box.hidden=false;box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openResult(res[+b.dataset.k]))};
  q.addEventListener('input',draw);q.addEventListener('focus',()=>{if(q.value.trim())draw()});
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&res[0]){e.preventDefault();openResult(res[0])}if(e.key==='Escape'){q.value='';box.hidden=true}});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))box.hidden=true});
  document.addEventListener('wheel',e=>{const c=e.target.closest&&e.target.closest('.chips');if(c&&c.scrollWidth>c.clientWidth+2&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){c.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  addEventListener('resize',setHH);
  const h=decodeURIComponent(location.hash.slice(1));go(known(h)?h:'inicio');
  window.__test={go,searchKit,SECTIONS,AN,RX,CD,EX,SC,NC,FN};
})();

})();
</script>

<button class="upd" id="upd" hidden>Nova versão do Kit: toque para atualizar</button>
<script>
/* PWA: funciona offline e se atualiza sozinho quando há versão nova */
if('serviceWorker' in navigator){
  let refreshing=false;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const check=()=>reg.update().catch(()=>{});
      setInterval(check,30*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    const b=document.getElementById('upd');
    if(!window.__touched){refreshing=true;location.reload();return}
    b.hidden=false;b.onclick=()=>{refreshing=true;location.reload()};
  });
  ['input','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{window.__touched=true},{once:true,capture:true}));
}
</script>
